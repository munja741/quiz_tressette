<title>Test otvaranja</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Sans+3:wght@400;600;700&family=Alegreya+SC:wght@700&display=swap">
<style>
/* Layout: one card-table column; the hand of ten cards is the centre of every screen, feedback slides in under it. Single look: green felt, deliberately dark. */
:root{
  --felt:#163b2c; --felt-deep:#0f2b20; --felt-line:#2b5a45;
  --cream:#f1ebdc; --cream-dim:#b9c4b7; --brass:#d8b45a; --brass-ink:#2a1f05;
  --card:#fbf7ee; --card-edge:#d8cfbd;
  --kupe:#2c5896; --spade:#1f1f1f; --dinari:#c4900f; --bastoni:#c2412d;
  --good:#7fcf8f; --warn:#e9b44c; --bad:#ff7a66;
  --f-head:"Big Shoulders Display","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-rank:"Alegreya SC",Georgia,serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%, var(--felt) 0%, var(--felt-deep) 100%) fixed, var(--felt-deep); color:var(--cream); font-family:var(--f-body); font-size:16px; line-height:1.45}
.wrap{max-width:46rem; margin:0 auto; padding-inline:16px; padding-block:1rem 3rem}
header.top{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap; border-bottom:1px solid var(--felt-line); padding-bottom:.6rem}
h1{font-family:var(--f-head); font-weight:800; font-size:clamp(1.9rem,7vw,2.6rem); letter-spacing:.02em; text-transform:uppercase; margin:0; line-height:1}
.meta{display:flex; gap:1rem; font-family:var(--f-head); font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:.95rem; color:var(--cream-dim)}
.meta b{color:var(--brass); font-weight:800}
.pips{display:flex; gap:6px; margin:.8rem 0 0}
.pip{flex:1; height:4px; border-radius:2px; background:var(--felt-line)}
.pip.done{background:var(--brass)} .pip.cur{background:var(--cream)}
.ask{margin:1.2rem 0 .3rem; font-size:1.15rem}
.ask strong{font-family:var(--f-head); font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:1.25rem; display:block; color:var(--brass)}
.hint{color:var(--cream-dim); font-size:.92rem; margin:0 0 .8rem}
.hand{display:flex; flex-wrap:wrap; gap:14px 18px; margin:1rem 0 .4rem}
.suit{display:flex; flex-direction:column; gap:6px; min-width:0}
.suit-name{font-family:var(--f-head); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:.8rem; color:var(--cream-dim)}
.cards{display:flex; gap:6px}
.void{font-style:italic; color:var(--cream-dim); font-size:.9rem; padding:.4rem 0}
.card{position:relative; width:62px; height:96px; border-radius:7px; background:var(--card); border:0; box-shadow:0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.25); cursor:pointer; padding:0; transition:transform .15s ease, box-shadow .15s ease}
.card svg{display:block; width:100%; height:100%}
.card:hover{transform:translateY(-4px)}
.card[aria-pressed="true"]{transform:translateY(-12px); box-shadow:0 0 0 3px var(--brass), 0 10px 18px rgba(0,0,0,.35)}
.card:focus-visible{outline:3px solid var(--cream); outline-offset:3px}
.card:disabled{cursor:default; opacity:.55; transform:none}
.card.played{opacity:1; box-shadow:0 0 0 3px var(--brass)}
.signals{margin:1.2rem 0 .2rem}
.signals .lab{font-family:var(--f-head); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:.85rem; color:var(--cream-dim); margin-bottom:.4rem}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{font:inherit; font-weight:600; color:var(--cream); background:transparent; border:1px solid var(--felt-line); border-radius:999px; padding:.55rem .95rem; min-height:44px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brass); color:var(--brass-ink); border-color:var(--brass)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--cream); outline-offset:2px}
.chip:disabled{opacity:.5; cursor:default}
.actions{display:flex; gap:10px; align-items:center; margin-top:1.1rem; flex-wrap:wrap}
.btn{font-family:var(--f-head); font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:1.05rem; background:var(--brass); color:var(--brass-ink); border:0; border-radius:8px; padding:.7rem 1.4rem; min-height:48px; cursor:pointer}
.btn:disabled{background:var(--felt-line); color:var(--cream-dim); cursor:default}
.btn.ghost{background:transparent; color:var(--cream); border:1px solid var(--felt-line)}
.sel{color:var(--cream-dim); font-size:.95rem}
.sel b{color:var(--cream)}
.result{margin-top:1.3rem; background:rgba(0,0,0,.22); border:1px solid var(--felt-line); border-radius:10px; padding:1rem 1.1rem}
.verdict{font-family:var(--f-head); font-weight:800; font-size:1.7rem; letter-spacing:.04em; text-transform:uppercase; line-height:1}
.v-savrseno{color:var(--good)} .v-pogresno{color:var(--warn)} .v-katastrofalno{color:var(--bad)}
.pts{font-family:var(--f-head); font-weight:700; color:var(--cream-dim); letter-spacing:.06em; margin-left:.4rem; font-size:1rem}
.result p{margin:.6rem 0 0}
.src{font-size:.85rem; color:var(--cream-dim)}
.theme{font-family:var(--f-head); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--brass); font-size:.9rem; margin-top:.2rem}
.follow{margin-top:1rem; border-top:1px dashed var(--felt-line); padding-top:.9rem}
.follow .q{font-weight:600}
.opts{display:grid; gap:8px; margin-top:.6rem}
.opt{font:inherit; text-align:left; color:var(--cream); background:transparent; border:1px solid var(--felt-line); border-radius:8px; padding:.7rem .9rem; min-height:44px; cursor:pointer}
.opt:hover{border-color:var(--brass)}
.end{margin-top:1.4rem}
.score{display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap}
.score .big{font-family:var(--f-head); font-weight:800; font-size:4.2rem; line-height:.9; color:var(--brass)}
.score .of{font-family:var(--f-head); font-weight:700; font-size:1.4rem; color:var(--cream-dim)}
.level{font-family:var(--f-head); font-weight:800; text-transform:uppercase; letter-spacing:.04em; font-size:2.2rem; margin:.6rem 0 0; line-height:1}
.level-d{color:var(--cream-dim); margin:.35rem 0 0; max-width:36rem}
.review{list-style:none; padding:0; margin:1.4rem 0 0; display:grid; gap:10px}
.review li{background:rgba(0,0,0,.2); border:1px solid var(--felt-line); border-radius:10px; padding:.8rem 1rem}
.review .h{display:flex; justify-content:space-between; gap:.8rem; flex-wrap:wrap; font-weight:600}
.review .best{color:var(--cream-dim); font-size:.93rem; margin-top:.3rem}
footer{margin-top:2.4rem; color:var(--cream-dim); font-size:.82rem; border-top:1px solid var(--felt-line); padding-top:.8rem}
@media (max-width:420px){ .card{width:54px; height:84px} .hand{gap:12px 14px} }
@media (prefers-reduced-motion: reduce){ .card{transition:none} }
</style>

<div class="wrap">
  <header class="top">
    <h1>Test otvaranja</h1>
    <div class="meta"><span>Ruka <b id="hNo">1</b>/<span id="hTot">6</span></span><span>Bodovi <b id="pts">0</b></span></div>
  </header>
  <div class="pips" id="pips" aria-hidden="true"></div>
  <main id="app"></main>
  <footer>Prema priručniku <i>Biblija trešete u parove</i> (il regista). Prvi si od ruke, partner sjedi nasuprot. Savršeno 3 boda, pogrešno 0, katastrofalno −2.</footer>
</div>

function cardSVG(s,r){

function reset(){ st={i:0, score:0, log:[], sel:null, sig:null, phase:'pick'}; draw(); }
function cardLabel(s,r){ return RNAME[r]+' '+SUITS[s].g; }
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function pips(){ var h=''; for(var k=0;k<HANDS.length;k++){ h+='<div class="pip '+(k<st.i?'done':(k===st.i?'cur':''))+'"></div>'; } pipsEl.innerHTML=h; }

function handHTML(H,lock){
  var h='<div class="hand">';
  ORDER.forEach(function(s){
    var cs=H.karte[s]||[];
    h+='<div class="suit"><div class="suit-name">'+SUITS[s].n+'</div>';
    if(!cs.length){ h+='<div class="void">nema</div>'; }
    else { h+='<div class="cards">'; cs.forEach(function(r){
      var on=st.sel&&st.sel.s===s&&st.sel.r===r;
      h+='<button type="button" class="card'+(lock&&on?' played':'')+'" style="--c:'+SUITS[s].c+'" data-s="'+s+'" data-r="'+r+'" aria-pressed="'+(on?'true':'false')+'" aria-label="'+esc(cardLabel(s,r))+'"'+(lock?' disabled':'')+'>'+cardSVG(s,r)+'</button>';
    }); h+='</div>'; }
    h+='</div>';
  });
  return h+'</div>';
}

function draw(){
  ptsEl.textContent=st.score; pips();
  if(st.i>=HANDS.length){ return drawEnd(); }
  hNo.textContent=st.i+1;
  var H=HANDS[st.i], lock=st.phase!=='pick';
  var h='<p class="ask"><strong>Kako otvaraš?</strong>Prvi si od ruke. Dodirni kartu, odaberi signal i otvori.</p>';
  h+=handHTML(H,lock);
  var sigs=SIG.concat(H.extra||[]);
  h+='<div class="signals"><div class="lab">Signal</div><div class="chips" role="group" aria-label="Signal">';
  sigs.forEach(function(x){ h+='<button type="button" class="chip" data-sig="'+x[0]+'" aria-pressed="'+(st.sig===x[0]?'true':'false')+'"'+(lock?' disabled':'')+'>'+esc(x[1])+'</button>'; });
  h+='</div></div>';
  if(st.phase==='pick'){
    var ready=st.sel&&st.sig;
    h+='<div class="actions"><button type="button" class="btn" id="go"'+(ready?'':' disabled')+'>Otvori</button><span class="sel">'+(st.sel?'Igraš: <b>'+esc(cardLabel(st.sel.s,st.sel.r))+'</b>'+(st.sig?' · '+esc(sigName(st.sig)):''):'Još nisi odabrao kartu.')+'</span></div>';
  } else { h+=resultHTML(H); }
  app.innerHTML=h;
  bind(H);
}
function sigName(k){ var all=SIG.concat(HANDS[Math.min(st.i,HANDS.length-1)].extra||[]); for(var j=0;j<all.length;j++){ if(all[j][0]===k) return all[j][1]; } return k; }

function grade(H){
  for(var j=0;j<H.opts.length;j++){ var o=H.opts[j];
    if(o.s===st.sel.s && o.c.indexOf(st.sel.r)>-1 && (o.sig===null || o.sig===st.sig)) return o; }
  return {r:'pogresno', why:'Ovo otvaranje priručnik u ovoj ruci ne preporučuje.'};
}

function resultHTML(H){
  var g=st.cur, h='<div class="result" aria-live="polite">';
  h+='<div class="theme">'+esc(H.tema)+' · '+esc(H.tocka)+'</div>';
  h+='<div style="margin-top:.4rem"><span class="verdict v-'+g.r+'">'+VNAME[g.r]+'</span>';
  if(!(g.follow&&st.phase==='follow')) h+='<span class="pts">'+fmt(PTS[st.final?st.final.r:g.r])+'</span>';
  h+='</div><p>'+esc(g.why)+'</p>';
  if(g.follow){
    if(st.phase==='follow'){
      h+='<div class="follow"><div class="q">'+esc(g.follow.q)+'</div><div class="opts">';
      g.follow.ch.forEach(function(c,k){ h+='<button type="button" class="opt" data-k="'+k+'">'+esc(c.l)+'</button>'; });
      h+='</div></div>';
    } else {
      var f=st.final;
      h+='<div class="follow"><div class="q">'+esc(g.follow.q)+'</div><p><b>'+esc(f.l)+'</b></p><span class="verdict v-'+f.r+'" style="font-size:1.3rem">'+VNAME[f.r]+'</span><span class="pts">'+fmt(PTS[f.r])+'</span><p>'+esc(f.why)+'</p></div>';
    }
  }
  if(st.phase==='done'){
    var fin=st.final||g;
    if(fin.r!=='savrseno') h+='<p class="src">Savršeno otvaranje: '+esc(H.best)+'.</p>';
    h+='<div class="actions"><button type="button" class="btn" id="next">'+(st.i+1<HANDS.length?'Sljedeća ruka':'Pogledaj rezultat')+'</button></div>';
  }
  return h+'</div>';
}
function fmt(n){ return (n>0?'+':n<0?'−':'')+Math.abs(n)+(Math.abs(n)===1?' bod':' boda'); }

function bind(H){
  app.querySelectorAll('.card').forEach(function(b){ b.addEventListener('click',function(){ st.sel={s:b.dataset.s,r:b.dataset.r}; draw(); }); });
  app.querySelectorAll('.chip').forEach(function(b){ b.addEventListener('click',function(){ st.sig=b.dataset.sig; draw(); }); });
  var go=document.getElementById('go'); if(go) go.addEventListener('click',function(){
    var g=grade(H); st.cur=g; st.final=null;
    if(g.follow){ st.phase='follow'; } else { finish(H,g); }
    draw();
  });
  app.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ var f=st.cur.follow.ch[+b.dataset.k]; st.final=f; finish(H,f); draw(); }); });
  var nx=document.getElementById('next'); if(nx) nx.addEventListener('click',function(){ st.i++; st.sel=null; st.sig=null; st.cur=null; st.final=null; st.phase='pick'; draw(); window.scrollTo(0,0); });
}
function finish(H,g){ st.phase='done'; st.score+=PTS[g.r]; st.log.push({H:H, r:g.r, play:cardLabel(st.sel.s,st.sel.r)+', '+sigName(st.sig)}); }

function drawEnd(){
  hNo.textContent=HANDS.length; pips();
  var max=HANDS.length*3, p=Math.max(0,st.score)/max, L;
  if(p>=.9) L=['Sjena','Kao sjena se prilagođavaš svakoj ruci. Partner zna što imaš, a protivnici pred sobom vide zid.'];
  else if(p>=.67) L=['Iskusni igrač','Poznaješ pravila otvaranja. Još malo pa partneru uvijek šalješ točne vijesti.'];
  else if(p>=.4) L=['Igrač','Igraš razumno, ali otvaranje još ne govori partneru dovoljno. Ponovi poglavlje Otvaranje.'];
  else L=['Početnik','Svako otvaranje nešto govori partneru. Kreni od prvih točaka poglavlja Otvaranje.'];
  var h='<section class="end" aria-live="polite"><div class="score"><span class="big">'+st.score+'</span><span class="of">od '+max+' bodova</span></div>';
  h+='<div class="level">'+L[0]+'</div><p class="level-d">'+L[1]+'</p>';
  var miss=st.log.filter(function(x){ return x.r!=='savrseno'; });
  if(miss.length){
    h+='<ul class="review">';
    miss.forEach(function(x){ h+='<li><div class="h"><span>Ruka '+x.H.id+' · '+esc(x.H.tema)+'</span><span class="v-'+x.r+'">'+VNAME[x.r]+'</span></div><div class="best">Igrao si: '+esc(x.play)+'<br>Savršeno: '+esc(x.H.best)+' ('+esc(x.H.tocka)+')</div></li>'; });
    h+='</ul>';
  } else { h+='<p class="level-d">Sva otvaranja su savršena.</p>'; }
  h+='<div class="actions"><button type="button" class="btn" id="again">Ponovi test</button></div></section>';
  app.innerHTML=h;
  document.getElementById('again').addEventListener('click',function(){ reset(); window.scrollTo(0,0); });
  try{ var b=parseInt(localStorage.getItem('treseta-test-best')||'-99',10); if(st.score>b) localStorage.setItem('treseta-test-best',String(st.score)); }catch(e){}
}
reset();
})();
</script>
